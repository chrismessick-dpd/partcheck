<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Scripts only from this site and the pinned libraries (each checked by its hash). The STEP reader (OpenCascade as
     WebAssembly) runs in a same-origin worker, assets/occt-worker.js; connect-src covers pdf.js's worker and fonts. Nothing is uploaded. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net https://api.github.com https://signoff-auth.misty-dawn-b371.workers.dev https://signoff-auth-dev.misty-dawn-b371.workers.dev; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Partcheck · Mechanical package check</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23004952'/%3E%3Cpath d='M16 6.5 25 11.5v9L16 25.5 7 20.5v-9z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 11.5 16 16.5 25 11.5M16 16.5v9' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/suite.css">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" integrity="sha384-RRHfJ6w1mTlKUBMYT/hvnRiOzEB/vyRV3DrQOseb6oYfvaZSfdd0byS4bHps0k2R" crossorigin="anonymous"></script>
</head>
<body>
<div id="demo-banner" class="demo-banner" hidden></div>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand" data-act="home" style="cursor:pointer" title="Home">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M10 2.5 16.5 6v8L10 17.5 3.5 14V6z"/><path d="M3.5 6 10 9.5 16.5 6M10 9.5v8"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Partcheck</div>
        <div class="brand-sub">Mechanical package check</div>
      </div>
      <button class="icon-btn side-collapse" data-act="nav" title="Hide sidebar ( [ )" aria-label="Hide sidebar">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M7.5 3.5v13"/><path d="M13.5 8l-2 2 2 2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="side-head">
      <span class="side-label">Packages</span>
      <button class="icon-btn" data-act="open" title="Open a package" aria-label="Open a package">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </div>
    <nav class="side-list" id="pkg-list"></nav>
    <button class="side-link" id="convert-link" data-act="convert" title="Turn STEP files into STL, OBJ, GLB, or images">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11l-3-3M16 13H5l3 3"/></svg>
      Convert
    </button>
    <div class="side-tools" id="side-tools">
      <div class="side-head"><span class="side-label">Dovetail Signoff</span></div>
      <a class="side-link" href="../ee_design_review/index.html" data-signed data-demo-href hidden title="Open Signoff EE, electrical design review">
        <span class="tool-mark tool-mark-text">EE</span>
        <span>Signoff EE<small>Electrical design review</small></span>
      </a>
      <a class="side-link" href="../me_design_review/index.html" data-demo-href title="Open Signoff ME, mechanical design review">
        <span class="tool-mark tool-mark-text">ME</span>
        <span>Signoff ME<small>Mechanical design review</small></span>
      </a>
      <a class="side-link" href="../fw_design_review/index.html" data-signed data-demo-href hidden title="Open Signoff FW, firmware design review">
        <span class="tool-mark tool-mark-text">FW</span>
        <span>Signoff FW<small>Firmware design review</small></span>
      </a>
      <a class="side-link" href="../signoff_pl/index.html" data-signed data-internal data-demo-href title="Open Signoff PL, the product-level project view" hidden>
        <span class="tool-mark"><svg viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="1.8" width="5" height="4" rx="1"/><rect x="1.8" y="12.2" width="5" height="4" rx="1"/><rect x="11.2" y="12.2" width="5" height="4" rx="1"/><path d="M9 5.8v3.2M4.3 12.2V9h9.4v3.2"/></svg></span>
        <span>Signoff PL<small>Project lead</small></span>
      </a>
      <a class="side-link" href="../signoff/index.html" data-demo-href title="Back to Dovetail Signoff, all tools">
        <span class="tool-mark"><svg viewBox="0 0 18 18" fill="#fff"><rect x="2" y="2" width="6" height="6" rx="1.5"/><rect x="10" y="2" width="6" height="6" rx="1.5"/><rect x="2" y="10" width="6" height="6" rx="1.5"/><rect x="10" y="10" width="6" height="6" rx="1.5"/></svg></span>
        <span>All tools<small>Dovetail Signoff home</small></span>
      </a>
    </div>
    <!-- People & access (signoff/assets/people.js), for FTEs; the foot is signoff/assets/sidefoot.js's. -->
    <button type="button" class="side-link" id="people-link" data-people-open title="People and access in Signoff EE, ME, and FW" hidden>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.5" cy="7" r="2.8"/><path d="M2.5 16.5c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3"/><circle cx="14" cy="7.8" r="2.2"/><path d="M13.6 12.3c2 .1 3.4 1.4 3.9 3.7"/></svg>
      People &amp; access
    </button>
    <div class="side-version pc-muted pc-version" id="version"></div>
    <div class="side-foot">
      <button class="sync-pill" id="sync-pill" title="GitHub sign-in">
        <span class="sync-dot"></span>
        <span class="sync-text"><span class="sync-title">Not signed in</span><span class="sync-sub">Click to sign in</span></span>
      </button>
      <button class="icon-btn" data-act="theme" id="theme-btn" title="Dark mode" aria-label="Toggle dark mode"></button>
      <button class="icon-btn" data-foot-settings title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </aside>
  <main class="main" id="main">
    <header class="toolbar" id="toolbar">
      <button class="icon-btn menu-toggle" data-act="nav" title="Show sidebar ( [ )" aria-label="Show sidebar">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>
      <div class="toolbar-center"><div class="seg" id="view-seg" role="tablist" hidden></div></div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div class="pc-dropzone" aria-hidden="true"><div>Drop to open</div></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="file-input" multiple hidden accept=".step,.stp,.p21,.iges,.igs,.brep,.stl,.pdf,.dxf,.csv,.zip,.sldprt,.sldasm,.slddrw,.x_t">
<input type="file" id="dir-input" webkitdirectory multiple hidden>
<script src="assets/version.js"></script>
<script src="assets/util.js"></script>
<script src="assets/libs.js"></script>
<script src="assets/materials.js"></script>
<script src="assets/package.js"></script>
<script src="assets/mesh.js"></script>
<script src="assets/drawing.js"></script>
<script src="assets/checks.js"></script>
<script src="assets/analyze.js"></script>
<script src="assets/viewer.js"></script>
<script src="assets/export.js"></script>
<!-- The suite's sign-in, People & access, and sidebar foot, from the hub (Partcheck vendors no engine files on main). -->
<script src="../signoff/assets/auth.js"></script>
<script src="../signoff/assets/people.js"></script>
<script src="../signoff/assets/sidefoot.js"></script>
<script src="assets/app.js"></script>
<!-- Demo tour: signoff/assets/tour.js does nothing outside ?demo, or before the hub starts the tour. -->
<script src="../signoff/assets/tour.js"></script>
</body>
</html>
